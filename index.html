<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ショート動画</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <button class="header-btn" id="feedBtn" data-tab="feed">フィード</button>
      <h1 class="header-title">ショート動画</h1>
      <button class="header-btn" id="recordBtn" data-tab="record">録画</button>
    </header>

    <!-- Feed Tab -->
    <section class="tab active" id="tab-feed">
      <div class="video-feed" id="videoFeed">
        <!-- Video cards injected by JS -->
      </div>
      <p class="empty-msg" id="emptyMsg">動画がまだありません。録画タブで動画を作成してください。</p>
    </section>

    <!-- Record Tab -->
    <section class="tab" id="tab-record">
      <div class="record-container">
        <div class="preview-wrapper">
          <video id="preview" autoplay muted playsinline></video>
          <div class="record-overlay" id="recordOverlay">
            <div class="countdown" id="countdown"></div>
            <div class="rec-badge" id="recBadge">● REC</div>
            <div class="timer" id="timer">00:00</div>
          </div>
        </div>

        <div class="controls">
          <label class="control-label">最大長さ</label>
          <div class="duration-btns">
            <button class="duration-btn active" data-sec="15">15秒</button>
            <button class="duration-btn" data-sec="30">30秒</button>
            <button class="duration-btn" data-sec="60">60秒</button>
          </div>

          <button class="btn-record" id="startBtn">カメラを起動</button>
          <button class="btn-stop hidden" id="stopBtn">録画停止</button>
        </div>

        <!-- Review recorded clip -->
        <div class="review hidden" id="review">
          <h2>プレビュー</h2>
          <video id="reviewVideo" controls playsinline></video>
          <div class="review-controls">
            <input class="title-input" id="titleInput" type="text" placeholder="タイトルを入力…" maxlength="50" />
            <button class="btn-save" id="saveBtn">保存してフィードに追加</button>
            <button class="btn-discard" id="discardBtn">破棄</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Video modal -->
  <div class="modal hidden" id="modal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <video id="modalVideo" controls playsinline></video>
      <div class="modal-info">
        <p class="modal-title" id="modalTitle"></p>
        <p class="modal-date" id="modalDate"></p>
        <div class="modal-actions">
          <button class="action-btn like-btn" id="likeBtn">♡ いいね</button>
          <button class="action-btn delete-btn" id="deleteBtn">🗑 削除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
